<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
    <!-- Default theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css"/>
    <!-- Semantic UI theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/semantic.min.css"/>
    <!-- Bootstrap theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/bootstrap.min.css"/>
    <title>CRUD Alumnos + mongoDB + notificaciones + Socket.io</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <h1>CRUD Alumnos + mongoDB + notificaciones + Socket.io</h1>
        </div>
        <div class="row">
            <div class="col-12 col-md-6">
                <form id="frmAlumno" data-accion="nuevo" data-idalumno="">
                    <div class="card text-bg-dark mb-3">
                        <div class="card-header">Registro de alumnos</div>
                        <div class="card-body p-1">
                            <div class="row p-1">
                                <div class="col-12 col-md-4">
                                    <input id="txtCodigoAlumno" type="text" class="form-control" placeholder="Código">
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-12 col-md-8">
                                    <input id="txtNombreAlumno" type="text" class="form-control" placeholder="Nombre">
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col">
                                    <input id="txtDireccionAlumno" type="text" class="form-control" placeholder="Dirección">
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-12 col-md-4">
                                    <input id="txtTelefonoAlumno" type="text" class="form-control" placeholder="Teléfono">
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-12 col-md-4">
                                    <input id="txtEmailAlumno" type="text" class="form-control" placeholder="Email">
                                </div>
                            </div>
                        </div>
                        <div class="card-footer p-1">
                            <div class="row p-1">
                                <div class="col text-center">
                                    <button id="btnGuardarAlumno" type="submit" class="btn btn-primary">Guardar</button>
                                    <button id="btnNuevoAlumno" type="reset" class="btn btn-warning">Nuevo</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col-12 col-md-6">
                <table class="table table-dark table-striped table-hover">
                    <thead>
                        <tr>
                            <th colspan="6">
                                <input id="txtBuscarAlumno" type="text" class="form-control" placeholder="Buscar">
                            </th>
                        </tr>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Dirección</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyAlumnos">
                    </tbody>
                </table>
            </div>
        </div>
        <div class="row">
            <form>
               <div id="estado">Conectando...</div>
               <ul id="ulMensajes"></ul>
               <input type="text" id="txtMensaje" placeholder="Escribe tu mensaje...">
               <button type="button" 
                   onclick="enviarMensaje()">
                   Enviar mensaje
               </button>
            </form>
        </div>
    </div>
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js" 
        integrity="sha512-8BHxHDLsOHx+flIrQ0DrZcea7MkHqRU5GbTHmbdzMRnAaoCIkZ97PqZcXJkKZckMMhqfoeaJE+DNUVuyoQsO3Q==" 
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="main.js"></script>
</body>
</html>
